<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Site | Vishwakarma ERP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --primary-light: #f0fdfa;
            --bg: #f1f5f9;
            --card: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #475569;
            --radius: 12px;
            --shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            margin: 0; 
            background: var(--bg); 
            background-image: radial-gradient(circle at 2px 2px, var(--border) 1px, transparent 0);
            background-size: 32px 32px;
            padding: 40px 20px; 
            color: var(--text-main);
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: var(--card);
            padding: 0;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        /* Header Styling */
        .form-header {
            background: var(--primary);
            padding: 35px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-header h1 { margin: 0; font-size: 1.6rem; display: flex; align-items: center; gap: 15px; }
        .form-header p { margin: 5px 0 0 45px; opacity: 0.9; font-size: 0.9rem; }

        .form-body { padding: 40px; }

        /* Grid System */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .full-width { grid-column: span 2; }

        .form-group { margin-bottom: 5px; }
        
        label { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-weight: 600; 
            margin-bottom: 8px; 
            font-size: 0.85rem; 
            color: var(--text-sub); 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        label i { color: var(--primary); font-size: 1rem; width: 20px; text-align: center; }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            outline: none;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #fcfcfc;
            transition: all 0.2s ease;
        }

        input:focus, select:focus { 
            border-color: var(--primary); 
            background-color: white;
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        /* Actions/Buttons */
        .actions { 
            display: flex; 
            gap: 15px; 
            margin-top: 40px; 
            padding-top: 30px; 
            border-top: 1px solid var(--border);
        }

        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            font-size: 1rem;
        }

        .btn-save { 
            background: var(--primary); 
            color: white; 
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.3); 
        }
        .btn-save:hover { 
            background: var(--primary-dark); 
            transform: translateY(-2px); 
        }

        .cancel-btn { 
            background: #f1f5f9; 
            color: var(--text-sub); 
        }
        .cancel-btn:hover { 
            background: #e2e8f0; 
            color: var(--text-main); 
        }

        /* Helper Text */
        .helper-text {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 4px;
        }

        @media (max-width: 768px) { 
            .grid { grid-template-columns: 1fr; } 
            .full-width { grid-column: span 1; } 
            .form-body { padding: 25px; }
            .form-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>

<body>

<div class="container">
    <!-- Header Section -->
    <div class="form-header">
        <div>
            <h1><i class="fas fa-plus-circle"></i> Add New Site</h1>
            <p>Initialize a new construction project and assign a site engineer.</p>
        </div>
        <i class="fas fa-building fa-3x" style="opacity: 0.2;"></i>
    </div>

    <!-- Form Section -->
    <form id="siteForm" class="form-body">
        <div class="grid">
            <!-- Project Title -->
            <div class="form-group full-width">
                <label><i class="fas fa-signature"></i> Site Name *</label>
                <input type="text" name="name" placeholder="e.g., Green Valley Residency" required>
            </div>

            <!-- Status & Risk -->
            <div class="form-group">
                <label><i class="fas fa-tasks"></i> Project Status</label>
                <select name="status">
                    <option value="ongoing">Ongoing</option>
                    <option value="completed">Completed</option>
                    <option value="halted">Halted</option>
                    <option value="upcoming">Upcoming</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-shield-alt"></i> Risk Assessment</label>
                <select name="risk">
                    <option value="On Track">On Track</option>
                    <option value="Minor Delay">Minor Delay</option>
                    <option value="At Risk">At Risk</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>

            <!-- Progress & Budget -->
            <div class="form-group">
                <label><i class="fas fa-percentage"></i> Initial Completion (%)</label>
                <input type="number" name="completion" min="0" max="100" value="0">
            </div>

            <div class="form-group">
                <label><i class="fas fa-wallet"></i> Estimated Budget (₹)</label>
                <input type="number" name="budget" step="0.01" placeholder="Enter amount in INR">
            </div>

            <!-- Timeline -->
            <div class="form-group">
                <label><i class="fas fa-calendar-plus"></i> Start Date</label>
                <input type="date" name="startDate">
            </div>

            <div class="form-group">
                <label><i class="fas fa-hourglass-end"></i> Delivery Deadline</label>
                <input type="date" name="deadline">
            </div>

            <!-- Manpower & Client -->
            <div class="form-group">
                <label><i class="fas fa-users"></i> Initial Workforce Count</label>
                <input type="number" name="workersCount" placeholder="Number of workers">
            </div>

            <div class="form-group">
                <label><i class="fas fa-user-tie"></i> Client Name</label>
                <input type="text" name="clientName" placeholder="Enter client's full name">
            </div>

            <div class="form-group">
                <label><i class="fas fa-phone-alt"></i> Client Phone Number</label>
                <input type="text" name="clientPhone" placeholder="10-digit mobile number">
            </div>

            <div class="form-group">
                <label><i class="fas fa-map-marker-alt"></i> Site Location</label>
                <input type="text" name="siteLocation" placeholder="Locality, City">
            </div>

            <!-- Staff Assignment -->
            <div class="form-group full-width">
                <label><i class="fas fa-user-hard-hat"></i> Assigned Site Engineer *</label>
                <select name="siteEngineer" id="supervisorselect" required>
                    <option value="">Loading engineers...</option>
                </select>
            </div>
        </div>

        <!-- Submission Buttons -->
        <div class="actions">
            <button type="submit" class="btn btn-save"><i class="fas fa-check-circle"></i> Create Project Site</button>
            <a href="/md/dashboard" class="btn cancel-btn"><i class="fas fa-times"></i> Cancel</a>
        </div>
    </form>
</div>

<script>
    // Fetch and populate the engineer dropdown from backend
    async function loadsupervisors() {
        try {
            const res = await fetch("/md/supervisors");
            const data = await res.json();
            const supervisorselect = document.getElementById("supervisorselect");
            
            supervisorselect.innerHTML = `<option value="">-- Select Assigned Engineer --</option>`;
            data.forEach(s => {
                supervisorselect.innerHTML += `<option value="${s.userId}">${s.username}</option>`;
            });
        } catch (err) {
            console.error("Failed to load engineers:", err);
            document.getElementById("supervisorselect").innerHTML = `<option value="">Error loading engineers</option>`;
        }
    }
    
    document.addEventListener("DOMContentLoaded", loadsupervisors);

    // Form submission logic
    document.getElementById("siteForm").addEventListener("submit", async e => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));

        try {
            const res = await fetch("/md/sites", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await res.json();
            if (!res.ok) return alert("Error: " + result.error);
            
            alert("Project site created successfully!");
            location.href = "/md/dashboard";
        } catch (err) {
            alert("Network error occurred while creating site.");
        }
    });
</script>

</body>
</html>
