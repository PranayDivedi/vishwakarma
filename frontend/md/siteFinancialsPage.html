<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Site Financials | Mission Vishwakarma</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        /*-------------------------------------------
         * THEME: ENHANCED TEAL & SLATE (MATCHED)
        /*-------------------------------------------*/
        :root {
            --primary-color: #0d9488; --primary-color-dark: #0f766e; --primary-color-light: #f0fdfa;
            --sidebar-bg: #1e293b; --sidebar-text: #cbd5e1; --sidebar-text-hover: #ffffff;
            --background-page: #f1f5f9; --background-card: #ffffff;
            --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
            --border-color: #e2e8f0; --success-color: #22c55e; --danger-color: #ef4444;
            --warning-color: #f59e0b; --info-color: #3b82f6;
            --font-family: 'Poppins', sans-serif; --border-radius: 0.75rem;
            --shadow-md: 0 4px 12px rgba(0,0,0,0.05); --transition-speed: 0.3s ease;
        }

        /* Global Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-family); }
        body { background-color: var(--background-page); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar (Matched) */
        .sidebar {
            width: 260px; background-color: var(--sidebar-bg); color: var(--sidebar-text);
            display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid var(--border-color); height: 100vh;
        }
        .sidebar-header { padding: 1.5rem 1.25rem; text-align: center; }
        .logo-text { font-size: 1.6rem; font-weight: 700; color: var(--sidebar-text-hover); text-decoration: none; }
        .sidebar-nav { flex-grow: 1; padding: 0 1rem; overflow-y: auto; }
        .sidebar-nav a { 
            display: flex; align-items: center; color: var(--sidebar-text); text-decoration: none; 
            padding: 12px 18px; border-radius: 8px; margin-bottom: 8px; transition: all var(--transition-speed); border-left: 4px solid transparent; 
        }
        .sidebar-nav a:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--sidebar-text-hover); border-left-color: var(--primary-color); }
        .sidebar-nav a.active { background-color: var(--primary-color); color: var(--sidebar-text-hover); font-weight: 600; }
        .sidebar-nav i { margin-right: 12px; width: 20px; text-align: center; }

        /* Main Content */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { 
            background: var(--background-card); padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color); 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; 
        }
        .header-title { display: flex; align-items: center; gap: 15px; }
        .content-area { padding: 1.5rem; overflow-y: auto; flex-grow: 1; }

        /* KPI & Graph Row */
        .top-row { display: grid; grid-template-columns: 1.5fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .stat-card { 
            background: white; padding: 1.25rem; border-radius: var(--border-radius); 
            box-shadow: var(--shadow-md); display: flex; flex-direction: column; justify-content: center;
        }
        .stat-card label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .stat-card .val { font-size: 1.3rem; font-weight: 700; margin-top: 5px; }

        /* Compact Graph Card */
        .graph-card { 
            background: white; padding: 1rem; border-radius: var(--border-radius); 
            box-shadow: var(--shadow-md); display: flex; flex-direction: column;
        }
        .chart-container { height: 160px; position: relative; }

        /* Transaction Log Table */
        .card { background: var(--background-card); border-radius: var(--border-radius); padding: 1.5rem; box-shadow: var(--shadow-md); }
        .card-header { font-weight: 600; font-size: 1.1rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        
        table { width: 100%; border-collapse: collapse; }
        thead th { background: var(--background-page); text-align: left; padding: 14px 12px; font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; border-bottom: 2px solid var(--border-color); }
        tbody tr { border-bottom: 1px solid var(--border-color); transition: 0.2s; }
        tbody tr:hover { background-color: var(--primary-color-light); }
        td { padding: 14px 12px; font-size: 0.9rem; }

        /* Helpers */
        .btn { padding: 8px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: 0.85rem; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-outline { background: #e2e8f0; color: var(--text-secondary); }
        .type-Credit { color: var(--success-color); font-weight: 700; }
        .type-Debit { color: var(--danger-color); font-weight: 700; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 2rem; border-radius: var(--border-radius); width: 100%; max-width: 450px; box-shadow: var(--shadow-md); }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; }
        .form-control { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; outline: none; }

        @media (max-width: 1000px) { .top-row { grid-template-columns: 1fr; } .sidebar { display: none; } }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="#" class="logo-text">Vishwakarma</a>
        </div>
        <nav class="sidebar-nav">
            <a href="/md/dashboard"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="/md/siteDetailsPage" class="active"><i class="fas fa-building"></i> Site Details</a>
            <a href="/md/EmployeesPage"><i class="fas fa-users-cog"></i> Employees</a>
            <a href="/md/financialsPage"><i class="fas fa-wallet"></i> Financials</a>
            <a href="/md/clientRequirementsPage"><i class="fas fa-user-check"></i> Client Requirements</a>
            <a href="/md/stockRequestsPage"><i class="fas fa-cubes"></i> Stock Requests</a>
            <a href="/md/allSitesPage"><i class="fas fa-map-marked-alt"></i> All Sites</a>
            <a href="/md/allGalleryPage"><i class="fas fa-images"></i> Gallery</a>
            <a href="/md/performancePage"><i class="fas fa-chart-pie"></i> Performance</a>
            <a href="#" onclick="logout()" style="margin-top: 20px; color: var(--danger-color);"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <div class="header-title">
                <a href="#" id="backBtn" class="btn btn-outline"><i class="fas fa-arrow-left"></i></a>
                <h2 id="site-name-display">Site Financial Logs</h2>
            </div>
            <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> New Transaction</button>
        </header>

        <section class="content-area">
            <!-- Stats and Mini Graph -->
            <div class="top-row">
                <div class="stats-grid">
                    <div class="stat-card" style="border-bottom: 4px solid var(--success-color);">
                        <label>Credits (Income)</label>
                        <div id="totalCredit" class="val type-Credit">₹0</div>
                    </div>
                    <div class="stat-card" style="border-bottom: 4px solid var(--danger-color);">
                        <label>Debits (Expense)</label>
                        <div id="totalDebit" class="val type-Debit">₹0</div>
                    </div>
                    <div class="stat-card" style="background: var(--primary-color); color: white;">
                        <label style="color: rgba(255,255,255,0.8);">Net Balance</label>
                        <div id="netBalance" class="val" style="color: white;">₹0</div>
                    </div>
                </div>
                <div class="graph-card">
                    <div class="chart-container">
                        <canvas id="miniChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Detailed Ledger / Log -->
            <div class="card">
                <div class="card-header">
                    <span><i class="fas fa-history" style="color: var(--primary-color); margin-right: 8px;"></i> Transaction Ledger</span>
                </div>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Narration / Description</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Mode Of Payment</th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="txnBody">
                            <!-- JS Dynamic -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal -->
    <div id="txnModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-bottom: 1.5rem;">Add Transaction</h3>
            <form id="txnForm">
                <input type="hidden" id="transactionId">
                <div class="form-group">
                    <label>Transaction Date</label>
                    <input type="date" id="tDate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Description / Details</label>
                    <input type="text" id="tDesc" class="form-control" placeholder="e.g. Raw material purchase" required>
                </div>
                <div class="form-group">
                    <label>Transaction Type</label>
                    <select id="tType" class="form-control">
                        <option value="Credit">Credit (Income)</option>
                        <option value="Debit">Debit (Expense)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" id="tAmount" class="form-control" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Mode Of Payment</label>
                    <select id="tMode" class="form-control">
                        <option value="UPI">UPI</option>
                        <option value="Cash">Cash</option>
                        <option value="NetBanking">Net Banking</option>
                        <option value="Cheque">Cheque</option>
                    </select>
                </div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button type="submit" class="btn btn-primary" style="flex:2">Save Transaction</button>
                    <button type="button" onclick="closeModal()" class="btn btn-outline" style="flex:1">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const siteId = new URLSearchParams(location.search).get("siteId");
        document.getElementById("backBtn").href = `/md/siteDetailsPage?siteId=${siteId}`;
        
        let chartInstance = null;

        async function loadTxns() {
            const res = await fetch(`/md/financials/${siteId}`);
            const data = await res.json();
            let cr = 0, dr = 0;
            const body = document.getElementById("txnBody");
            body.innerHTML = "";
            
            data.forEach(t => {
                const amt = parseFloat(t.amount);
                if(t.type === 'Credit') cr += amt; else dr += amt;
                body.innerHTML += `
                    <tr>
                        <td style="font-weight: 500;">${new Date(t.transactionDate).toLocaleDateString('en-GB')}</td>
                        <td>${t.description}</td>
                        <td><span class="type-${t.type}">${t.type}</span></td>
                        <td style="font-weight: 600;">₹${amt.toLocaleString('en-IN')}</td>
                        <td>${t.modeOfPayment}</td>
                        <td style="text-align: right;">
                            <i class="fas fa-edit" style="color:var(--primary-color); cursor:pointer; margin-right:15px" onclick='editTxn(${JSON.stringify(t)})'></i>
                            <i class="fas fa-trash" style="color:var(--danger-color); cursor:pointer" onclick="deleteTxn(${t.transactionId})"></i>
                        </td>
                    </tr>`;
            });

            if(data.length === 0) body.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 2rem; color: var(--text-muted);">No transactions recorded for this site.</td></tr>';

            document.getElementById("totalCredit").innerText = `₹${cr.toLocaleString('en-IN')}`;
            document.getElementById("totalDebit").innerText = `₹${dr.toLocaleString('en-IN')}`;
            document.getElementById("netBalance").innerText = `₹${(cr - dr).toLocaleString('en-IN')}`;

            updateChart(cr, dr);
        }

        function updateChart(credit, debit) {
            const ctx = document.getElementById('miniChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Credit', 'Debit'],
                    datasets: [{
                        data: [credit, debit],
                        backgroundColor: ['#22c55e', '#ef4444'],
                        borderRadius: 5,
                        barThickness: 30
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { display: false },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function openModal() { 
            document.getElementById("txnForm").reset();
            document.getElementById("transactionId").value = "";
            document.getElementById("modalTitle").innerText = "New Transaction";
            document.getElementById("txnModal").style.display = "flex"; 
            document.getElementById("tDate").valueAsDate = new Date();
        }

        function closeModal() { document.getElementById("txnModal").style.display = "none"; }

        function editTxn(t) {
            document.getElementById("modalTitle").innerText = "Edit Transaction";
            document.getElementById("transactionId").value = t.transactionId;
            document.getElementById("tDate").value = t.transactionDate.split('T')[0];
            document.getElementById("tDesc").value = t.description;
            document.getElementById("tType").value = t.type;
            document.getElementById("tAmount").value = t.amount;
            document.getElementById("txnModal").style.display = "flex";
            document.getElementById("tMode").value = t.modeOfPayment;
            
        }

        document.getElementById("txnForm").onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById("transactionId").value;
            const payload = {
                siteId,
                transactionDate: document.getElementById("tDate").value,
                description: document.getElementById("tDesc").value,
                type: document.getElementById("tType").value,
                amount: document.getElementById("tAmount").value,
                modeOfPayment: document.getElementById("tMode").value
            };
            const method = id ? 'PUT' : 'POST';
            const url = id ? `/md/financials/${id}` : '/md/financials';
            
            await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)});
            closeModal(); loadTxns();
        };

        async function deleteTxn(id) {
            if(confirm("Permanently delete this transaction?")) {
                await fetch(`/md/financials/${id}`, { method: 'DELETE' });
                loadTxns();
            }
        }

        function logout() { fetch("/auth/logout", { method: "POST" }).then(() => location.href = "/"); }

        loadTxns();
    </script>
</body>
</html>
