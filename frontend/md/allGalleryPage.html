<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Gallery & Assets | Vishwakarma</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        /*-------------------------------------------
         * THEME: ENHANCED TEAL & SLATE (MATCHED)
        /*-------------------------------------------*/
        :root {
            --primary-color: #0d9488; --primary-color-dark: #0f766e; --primary-color-light: #f0fdfa;
            --sidebar-bg: #1e293b; --sidebar-text: #cbd5e1; --sidebar-text-hover: #ffffff;
            --background-page: #f1f5f9; --background-card: #ffffff;
            --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
            --border-color: #e2e8f0; --success-color: #22c55e; --danger-color: #ef4444;
            --warning-color: #f59e0b; --info-color: #3b82f6;
            --font-family: 'Poppins', sans-serif; --border-radius: 0.75rem;
            --shadow-md: 0 4px 12px rgba(0,0,0,0.05); --transition-speed: 0.3s ease;
        }

        /* Global Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-family); }
        body { background-color: var(--background-page); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar (Matched) */
        .sidebar {
            width: 260px; background-color: var(--sidebar-bg); color: var(--sidebar-text);
            display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid var(--border-color); height: 100vh;
        }
        .sidebar-header { padding: 1.5rem 1.25rem; text-align: center; }
        .logo-text { font-size: 1.6rem; font-weight: 700; color: var(--sidebar-text-hover); text-decoration: none; }
        .sidebar-nav { flex-grow: 1; padding: 0 1rem; overflow-y: auto; }
        .sidebar-nav a { 
            display: flex; align-items: center; color: var(--sidebar-text); text-decoration: none; 
            padding: 12px 18px; border-radius: 8px; margin-bottom: 8px; transition: all var(--transition-speed); border-left: 4px solid transparent; 
        }
        .sidebar-nav a:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--sidebar-text-hover); border-left-color: var(--primary-color); }
        .sidebar-nav a.active { background-color: var(--primary-color); color: var(--sidebar-text-hover); font-weight: 600; }
        .sidebar-nav i { margin-right: 12px; width: 20px; text-align: center; }

        /* Main Content */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { 
            background: var(--background-card); padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-color); 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; 
        }
        .header h2 { font-size: 1.4rem; font-weight: 600; color: var(--text-primary); }
        .content-area { padding: 1.5rem; overflow-y: auto; flex-grow: 1; }

        /* Filter Bar */
        .filter-bar { 
            background: var(--background-card); padding: 1rem 1.5rem; border-radius: var(--border-radius); 
            display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: center; box-shadow: var(--shadow-md);
            flex-wrap: wrap;
        }
        select, input[type="date"] { 
            padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px; 
            outline: none; font-size: 0.9rem; background: #fff; transition: 0.3s;
        }
        select:focus, input:focus { border-color: var(--primary-color); }

        .btn-reset { 
            padding: 10px 20px; border: 1px solid var(--primary-color); background: transparent; 
            color: var(--primary-color); border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .btn-reset:hover { background: var(--primary-color); color: #fff; }

        /* Tabs Switcher */
        .tab-switcher { 
            margin-left: auto; background: var(--background-page); padding: 4px; border-radius: 10px; display: flex; gap: 4px;
        }
        .tab-btn { 
            border: none; background: none; padding: 8px 18px; font-weight: 600; cursor: pointer; 
            color: var(--text-secondary); border-radius: 8px; transition: 0.3s; font-size: 0.85rem;
        }
        .tab-btn.active { background: var(--primary-color); color: #fff; box-shadow: var(--shadow-md); }

        /* Gallery Grid */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }

        .photo-card {
            background: var(--background-card); border-radius: var(--border-radius); overflow: hidden;
            position: relative; box-shadow: var(--shadow-md); border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .photo-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }

        .photo-img { width: 100%; height: 200px; object-fit: cover; cursor: pointer; display: block; }

        /* Document Placeholder */
        .doc-placeholder {
            width: 100%; height: 200px; background: #f8fafc;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; gap: 12px; border-bottom: 1px solid var(--border-color);
        }
        .doc-placeholder i { font-size: 4rem; color: var(--primary-color); }
        .doc-ext { 
            font-size: 0.75rem; font-weight: 700; background: var(--primary-color); color: #fff; 
            padding: 3px 10px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .delete-btn {
            position: absolute; top: 12px; right: 12px;
            background: rgba(239, 68, 68, 0.9); border: none; color: #fff;
            width: 36px; height: 36px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 5; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .delete-btn:hover { background: var(--danger-color); transform: scale(1.1); }

        .photo-info { padding: 15px; }
        .photo-caption { font-weight: 600; font-size: 0.95rem; margin-bottom: 6px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .photo-meta { font-size: 12px; color: var(--text-secondary); display: flex; justify-content: space-between; align-items: center; }
        .photo-meta .site-tag { color: var(--primary-color); font-weight: 600; }

        .hidden { display: none; }
        @media (max-width: 768px) { .sidebar { display: none; } .tab-switcher { margin-left: 0; width: 100%; } }
    </style>
</head>

<body>

<aside class="sidebar">
    <div class="sidebar-header">
        <a href="#" class="logo-text">Vishwakarma</a>
    </div>
    <nav class="sidebar-nav">
        <a href="/md/dashboard"><i class="fas fa-chart-line"></i> Dashboard</a>
        <a href="/md/siteDetailsPage"><i class="fas fa-building"></i> Site Details</a>
        <a href="/md/EmployeesPage"><i class="fas fa-users-cog"></i> Employees</a>
        <a href="/md/financialsPage"><i class="fas fa-wallet"></i> Financials</a>
        <a href="/md/clientRequirementsPage"><i class="fas fa-user-check"></i> Client Requirements</a>
        <a href="/md/stockRequestsPage"><i class="fas fa-cubes"></i> Stock Requests</a>
        <a href="/md/allSitesPage"><i class="fas fa-map-marked-alt"></i> All Sites</a>
        <a href="/md/allGalleryPage" class="active"><i class="fas fa-images"></i> Gallery</a>
        <a href="/md/performancePage"><i class="fas fa-chart-pie"></i> Performance</a>
        <a href="/md/tasksPage"><i class="fas fa-tasks"></i> Tasks</a>
        <a href="#" onclick="logout()" style="margin-top: 20px; color: var(--danger-color);"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </nav>
</aside>

<main class="main-content">
    <header class="header">
        <h2>Site Gallery & Assets</h2>
        <div id="user-info" style="font-weight: 600; font-size: 0.9rem; color: var(--text-secondary);">
            <i class="fas fa-folder-open" style="color: var(--primary-color); margin-right: 5px;"></i> Central Asset Manager
        </div>
    </header>

    <section class="content-area">
        <div class="filter-bar">
            <select id="siteFilter" onchange="filterData()">
                <option value="">All Sites</option>
            </select>

            <input type="date" id="dateFilter" onchange="filterData()">
            <button class="btn-reset" onclick="resetFilter()">Reset Filters</button>

            <div class="tab-switcher">
                <button id="btnPhotos" class="tab-btn active" onclick="switchTab('photos')">Photos</button>
                <button id="btnDocs" class="tab-btn" onclick="switchTab('docs')">Documents</button>
            </div>
        </div>

        <!-- PHOTOS PANEL -->
        <div id="photosPanel">
            <div class="gallery-grid" id="photoContainer"></div>
        </div>

        <!-- DOCS PANEL -->
        <div id="docsPanel" class="hidden">
            <div class="gallery-grid" id="docContainer"></div>
        </div>
    </section>
</main>

<script>
let allAssets=[];

document.addEventListener("DOMContentLoaded",async()=>{
    await fetchSites();
    await fetchAssets();
});

async function fetchSites(){
    try {
        const res=await fetch("/md/sites");
        const sites=await res.json();
        const sel=document.getElementById("siteFilter");
        sites.forEach(s=>{
            sel.innerHTML+=`<option value="${s.siteId}">${s.siteName}</option>`;
        });
    } catch(e) { console.error("Error fetching sites:", e); }
}

async function fetchAssets(){
    try {
        const res=await fetch("/md/allSitePhotos");
        allAssets=await res.json();
        filterData();
    } catch(e) { console.error("Error fetching assets:", e); }
}

function filterData(){
    const site=document.getElementById("siteFilter").value;
    const date=document.getElementById("dateFilter").value;

    const filtered=allAssets.filter(a=>{
        const sOk=site===""||a.siteId===site;
        const dOk=date===""||a.uploadedAt.startsWith(date);
        return sOk && dOk;
    });
    renderAssets(filtered);
}

function isImage(url){
    return /\.(jpg|jpeg|png|webp|gif)$/i.test(url);
}

function renderAssets(data){
    const photoC=document.getElementById("photoContainer");
    const docC=document.getElementById("docContainer");
    photoC.innerHTML=""; docC.innerHTML="";

    if(data.length === 0) {
        const emptyMsg = `<p style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted);">No assets found for the selected criteria.</p>`;
        photoC.innerHTML = emptyMsg; docC.innerHTML = emptyMsg;
        return;
    }

    data.forEach(item=>{
        const date=new Date(item.uploadedAt).toLocaleDateString('en-GB');
        const ext = item.photoUrl.split('.').pop();

        if(isImage(item.photoUrl)){
            photoC.innerHTML+=`
            <div class="photo-card">
                <button class="delete-btn" onclick="deletePhoto(${item.photoId})" title="Delete Asset">
                    <i class="fas fa-trash"></i>
                </button>
                <img src="${item.photoUrl}" class="photo-img" onclick="window.open('${item.photoUrl}')">
                <div class="photo-info">
                    <div class="photo-caption">${item.caption||"Untitled Photo"}</div>
                    <div class="photo-meta">
                        <span class="site-tag">${item.siteName}</span>
                        <span><i class="far fa-calendar-alt"></i> ${date}</span>
                    </div>
                </div>
            </div>`;
        }else{
            docC.innerHTML+=`
            <div class="photo-card">
                <button class="delete-btn" onclick="deletePhoto(${item.photoId})" title="Delete Asset">
                    <i class="fas fa-trash"></i>
                </button>
                <div class="doc-placeholder" onclick="window.open('${item.photoUrl}')">
                    <i class="fas fa-file-pdf"></i>
                    <span class="doc-ext">${ext}</span>
                </div>
                <div class="photo-info">
                    <div class="photo-caption">${item.caption||"Untitled Document"}</div>
                    <div class="photo-meta">
                        <span class="site-tag">${item.siteName}</span>
                        <span><i class="far fa-calendar-alt"></i> ${date}</span>
                    </div>
                </div>
            </div>`;
        }
    });
}

async function deletePhoto(id){
    if(!confirm("Are you sure you want to delete this asset permanently?")) return;

    try {
        const res=await fetch(`/md/photos/${id}`,{method:"DELETE"});
        if(res.ok) fetchAssets();
        else alert("Delete failed");
    } catch(e) { alert("An error occurred while deleting."); }
}

function switchTab(t){
    document.getElementById("photosPanel").classList.toggle("hidden",t!=="photos");
    document.getElementById("docsPanel").classList.toggle("hidden",t!=="docs");
    document.getElementById("btnPhotos").classList.toggle("active",t==="photos");
    document.getElementById("btnDocs").classList.toggle("active",t==="docs");
}

function resetFilter(){
    document.getElementById("siteFilter").value="";
    document.getElementById("dateFilter").value="";
    filterData();
}

function logout(){
    fetch("/auth/logout",{method:"POST"}).then(()=>location.href="/");
}
</script>
</body>
</html>
