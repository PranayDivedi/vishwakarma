<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Requirements | Mission Vishwakarma</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        /*-------------------------------------------
         * THEME: ENHANCED TEAL & SLATE (MATCHED)
        /*-------------------------------------------*/
        :root {
            --primary-color: #0d9488; --primary-color-dark: #0f766e; --primary-color-light: #f0fdfa;
            --sidebar-bg: #1e293b; --sidebar-text: #cbd5e1; --sidebar-text-hover: #ffffff;
            --background-page: #f1f5f9; --background-card: #ffffff;
            --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
            --border-color: #e2e8f0; --success-color: #22c55e; --danger-color: #ef4444;
            --warning-color: #f59e0b; --info-color: #3b82f6;
            --font-family: 'Poppins', sans-serif; --border-radius: 0.75rem;
            --shadow-md: 0 4px 12px rgba(0,0,0,0.05); --transition-speed: 0.3s ease;
        }

        /* Global Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-family); }
        body { background-color: var(--background-page); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar (Matched) */
        .sidebar {
            width: 260px; background-color: var(--sidebar-bg); color: var(--sidebar-text);
            display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid var(--border-color); height: 100vh;
        }
        .sidebar-header { padding: 1.5rem 1.25rem; text-align: center; }
        .logo-text { font-size: 1.6rem; font-weight: 700; color: var(--sidebar-text-hover); text-decoration: none; }
        .sidebar-nav { flex-grow: 1; padding: 0 1rem; overflow-y: auto; }
        .sidebar-nav a { 
            display: flex; align-items: center; color: var(--sidebar-text); text-decoration: none; 
            padding: 12px 18px; border-radius: 8px; margin-bottom: 8px; transition: all var(--transition-speed); border-left: 4px solid transparent; 
        }
        .sidebar-nav a:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--sidebar-text-hover); border-left-color: var(--primary-color); }
        .sidebar-nav a.active { background-color: var(--primary-color); color: var(--sidebar-text-hover); font-weight: 600; }
        .sidebar-nav i { margin-right: 12px; width: 20px; text-align: center; }

        /* Main Area */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { 
            background: var(--background-card); padding: 1.25rem 1.5rem; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border-color); flex-shrink: 0; 
        }
        .header h2 { font-size: 1.4rem; font-weight: 600; }
        .content-area { padding: 1.5rem; overflow-y: auto; flex-grow: 1; }

        /* Card & Filter Styling */
        .card { background: var(--background-card); border-radius: var(--border-radius); padding: 1.5rem; box-shadow: var(--shadow-md); margin-bottom: 2rem; }
        .filter-section { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        
        /* Form Controls */
        .form-control { 
            padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border-color); 
            font-size: 0.9rem; outline: none; transition: border-color 0.3s; background: white;
        }
        .form-control:focus { border-color: var(--primary-color); }
        select.form-control { min-width: 200px; cursor: pointer; }

        /* Buttons */
        .btn { 
            padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; 
            transition: all 0.25s; border: none; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
        }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: var(--primary-color-dark); transform: translateY(-1px); }
        .btn-secondary { background: var(--sidebar-bg); color: white; }
        .btn-secondary:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger-color); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 0.75rem; }

        /* Table Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        thead th { background-color: var(--background-page); padding: 14px; text-align: left; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); border-bottom: 2px solid var(--border-color); text-transform: uppercase; }
        tbody tr { border-bottom: 1px solid var(--border-color); transition: 0.2s; }
        tbody tr:hover { background-color: var(--primary-color-light); }
        td { padding: 14px; font-size: 0.9rem; color: var(--text-primary); vertical-align: middle; }

        /* Badges */
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: white; }
        .done { background: var(--success-color); }
        .pending { background: var(--warning-color); }

        /* Modal Styling */
        .modal { 
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); 
            display: none; align-items: center; justify-content: center; z-index: 1000; 
            backdrop-filter: blur(4px);
        }
        .modal-content { 
            background: white; padding: 2rem; width: 450px; border-radius: var(--border-radius); 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal h3 { margin-bottom: 1.5rem; color: var(--text-primary); font-size: 1.25rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }
        textarea, select.input-full { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.95rem; outline: none; resize: none; }

        @media (max-width: 768px) { .sidebar { display: none; } }
    </style>
</head>

<body>

    <!-- SIDEBAR (Matched to MD Dashboard) -->
    <div class="sidebar">
        <div class="sidebar-header">
            <a href="#" class="logo-text">Vishwakarma</a>
        </div>
        <nav class="sidebar-nav">
            <a href="/md/dashboard"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="/md/siteDetailsPage"><i class="fas fa-building"></i> Site Details</a>
            <a href="/md/EmployeesPage"><i class="fas fa-users-cog"></i> Employees</a>
            <a href="/md/financialsPage"><i class="fas fa-wallet"></i> Financials</a>
            <a href="/md/clientRequirementsPage" class="active"><i class="fas fa-user-check"></i> Client Requirements</a>
            <a href="/md/stockRequestsPage"><i class="fas fa-cubes"></i> Stock Requests</a>
            <a href="/md/allSitesPage"><i class="fas fa-map-marked-alt"></i> All Sites</a>
            <a href="/md/allGalleryPage"><i class="fas fa-images"></i> Gallery</a>
            <a href="/md/performancePage"><i class="fas fa-chart-pie"></i> Performance</a>
            <a href="/md/tasksPage"><i class="fas fa-tasks"></i> Tasks</a>
            <a href="#" onclick="logout()" style="margin-top: 20px; color: var(--danger-color);"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <header class="header">
            <h2>Client Requirements</h2>
            <button class="btn btn-primary" onclick="openModal()">
                <i class="fas fa-plus"></i> Add Requirement
            </button>
        </header>

        <main class="content-area">
            <div class="card">
                <div class="filter-section">
                    <label style="font-size: 0.9rem; font-weight: 600; color: var(--text-secondary);">Filter Project:</label>
                    <select id="siteFilter" class="form-control"></select>
                </div>

                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Site / Project</th>
                                <th>Requirement Details</th>
                                <th>Status</th>
                                <th>Created Date</th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="reqTable">
                            <!-- JS Dynamic Content -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div class="modal" id="reqModal">
        <div class="modal-content">
            <h3 id="modalTitle">Add Requirement</h3>
            <form id="reqForm">
                <input type="hidden" id="reqId">

                <div class="form-group">
                    <label>Select Project</label>
                    <select id="reqSite" class="form-control input-full" required></select>
                </div>

                <div class="form-group">
                    <label>Requirement Details</label>
                    <textarea id="reqDetails" rows="4" class="form-control" placeholder="Describe the client requirement here..." required></textarea>
                </div>

                <div style="margin-top: 2rem; display: flex; gap: 12px; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Requirement</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API = {
            requirements: "/md/client-requirements",
            sites: "/md/sites",
            logout: "/auth/logout"
        };

        let editing = false;

        /* LOAD SITES */
        async function loadSites() {
            try {
                const sites = await fetch(API.sites).then(r => r.json());
                const siteFilter = document.getElementById("siteFilter");
                const reqSite = document.getElementById("reqSite");

                siteFilter.innerHTML = `<option value="">All Sites</option>`;
                reqSite.innerHTML = "";

                sites.forEach(s => {
                    const opt = `<option value="${s.siteId}">${s.siteName}</option>`;
                    siteFilter.innerHTML += opt;
                    reqSite.innerHTML += opt;
                });
            } catch (err) { console.error("Error loading sites", err); }
        }

        /* LOAD REQUIREMENTS */
        async function loadRequirements(siteId = "") {
            try {
                const url = siteId ? `${API.requirements}?siteId=${siteId}` : API.requirements;
                const data = await fetch(url).then(r => r.json());
                const tbody = document.getElementById("reqTable");

                tbody.innerHTML = data.length ? "" :
                    `<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 2rem;">No client requirements recorded.</td></tr>`;

                data.forEach(r => {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong style="color: var(--primary-color-dark)">${r.siteName}</strong></td>
                            <td style="max-width: 300px; line-height: 1.5;">${r.details}</td>
                            <td>
                                <span class="badge ${r.completed ? "done" : "pending"}">
                                    ${r.completed ? "Completed" : "Pending"}
                                </span>
                            </td>
                            <td>${new Date(r.createdAt).toLocaleDateString("en-IN")}</td>
                            <td style="text-align: right;">
                                <div style="display: flex; gap: 5px; justify-content: flex-end;">
                                    <button class="btn btn-sm btn-primary" onclick='editReq(${JSON.stringify(r)})' title="Edit">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-sm btn-secondary" onclick='toggleStatus(${r.requirementId}, ${r.completed})' title="Toggle Status">
                                        <i class="fas fa-sync-alt"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick='deleteReq(${r.requirementId})' title="Delete">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) { console.error("Error loading requirements", err); }
        }

        /* FILTER */
        document.getElementById("siteFilter").onchange = (e) => loadRequirements(e.target.value);

        /* MODAL CONTROLS */
        function openModal() {
            editing = false;
            document.getElementById("reqForm").reset();
            document.getElementById("modalTitle").innerText = "Add Requirement";
            document.getElementById("reqModal").style.display = "flex";
        }
        function closeModal() { document.getElementById("reqModal").style.display = "none"; }

        /* EDIT */
        function editReq(r) {
            editing = true;
            document.getElementById("modalTitle").innerText = "Edit Requirement";
            document.getElementById("reqId").value = r.requirementId;
            document.getElementById("reqSite").value = r.siteId;
            document.getElementById("reqDetails").value = r.details;
            document.getElementById("reqModal").style.display = "flex";
        }

        /* SAVE (POST/PUT) */
        document.getElementById("reqForm").onsubmit = async e => {
            e.preventDefault();
            const payload = {
                siteId: document.getElementById("reqSite").value,
                details: document.getElementById("reqDetails").value
            };

            const method = editing ? "PUT" : "POST";
            const url = editing
                ? `${API.requirements}/${document.getElementById("reqId").value}`
                : API.requirements;

            await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            closeModal();
            loadRequirements(document.getElementById("siteFilter").value);
        };

        /* TOGGLE STATUS (PATCH) */
        async function toggleStatus(id, current) {
            await fetch(`${API.requirements}/${id}/status`, {
                method: "PATCH",
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ completed: !current })
            });
            loadRequirements(document.getElementById("siteFilter").value);
        }

        /* DELETE */
        function deleteReq(id) {
            if (!confirm("Are you sure you want to delete this requirement?")) return;
            fetch(`${API.requirements}/${id}`, { method: "DELETE" })
                .then(() => loadRequirements(document.getElementById("siteFilter").value));
        }

        /* LOGOUT */
        function logout() {
            fetch(API.logout, { method: "POST" }).then(() => location.href = "/");
        }

        /* INITIALIZE */
        loadSites();
        loadRequirements();
    </script>

</body>
</html>
