<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Site Activity | Vishwakarma</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        :root {
            --primary: #0d9488; --primary-dark: #0f766e; --bg: #f1f5f9; --text: #0f172a; --border: #e2e8f0;
            --pending: #f59e0b; --progress: #3b82f6; --completed: #22c55e;
        }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 30px; margin: 0; }
        
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--bg); padding-bottom: 15px; }
        .btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: 0.3s; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-back { background: #64748b; color: white; }

        .filter-bar { display: flex; gap: 15px; margin-bottom: 20px; }
        .search-input { flex-grow: 1; padding: 10px; border: 1px solid var(--border); border-radius: 6px; outline: none; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; background: #f8fafc; padding: 15px; font-size: 13px; text-transform: uppercase; color: #64748b; border-bottom: 2px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 14px; }



        .action-icons i { cursor: pointer; margin-left: 12px; transition: 0.2s; font-size: 1.1rem; }
        .fa-trash { color: #ef4444; }
        .fa-edit { color: var(--primary); }

        /* MODAL STYLES */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative;
        }
        .modal-header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; color: var(--primary); }
        .close-modal { cursor: pointer; font-size: 1.5rem; color: #94a3b8; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; outline: none; }
        .modal-footer { margin-top: 25px; display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <a href="#" id="backBtn" class="btn btn-back"><i class="fas fa-arrow-left"></i> Back</a>
            <h2 style="display:inline-block; margin:0; margin-left: 15px;">Site Activity Log</h2>
        </div>
        <button class="btn btn-primary" onclick="openActivityModal()"><i class="fas fa-plus"></i> Add Activity</button>
    </div>

    <div class="filter-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search description...">
    </div>

    <table id="activityTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Description</th>
                
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="activityBody">
            <!-- Data from API -->
        </tbody>
    </table>
</div>

<!-- ADD/EDIT MODAL -->
<div id="activityModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Add Activity</h3>
            <span class="close-modal" onclick="closeActivityModal()">&times;</span>
        </div>
        <form id="activityForm">
            <input type="hidden" id="activityId">
            
            <div class="form-group">
                <label>Activity Date *</label>
                <input type="date" id="activityDate" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Description *</label>
                <textarea id="description" class="form-control" rows="3" required placeholder="What was done?"></textarea>
            </div>


            <div class="modal-footer">
                <button type="button" class="btn btn-back" style="flex: 1;" onclick="closeActivityModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" style="flex: 2;">Save Activity</button>
            </div>
        </form>
    </div>
</div>

<script>
    const params = new URLSearchParams(location.search);
    const siteId = params.get("siteId");
    let allActivities = []; // Local storage for filtering

    document.getElementById("backBtn").href = `/supervisor/siteDetailsPage?siteId=${siteId}`;

    async function loadActivities() {
        try {
            const res = await fetch(`/md/activity/${siteId}`);
            allActivities = await res.json();
            renderTable(allActivities);
        } catch (err) {
            console.error("Error loading activities:", err);
        }
    }

    function renderTable(data) {
        const body = document.getElementById("activityBody");
        body.innerHTML = data.length ? "" : '<tr><td colspan="5" style="text-align:center">No activities found.</td></tr>';
        
        data.forEach(a => {
      
            const activityJson = JSON.stringify(a).replace(/'/g, "&apos;");

            body.innerHTML += `
                <tr>
                    <td>${new Date(a.activityDate).toLocaleDateString('en-GB')}</td>
                    <td>${a.description}</td>
               
                    <td class="action-icons">
                        <i class="fas fa-edit" title="Edit" onclick='openActivityModal(${activityJson})'></i>
                        <i class="fas fa-trash" title="Delete" onclick="deleteActivity(${a.activityId})"></i>
                    </td>
                </tr>
            `;
        });
    }

    // MODAL LOGIC
    function openActivityModal(data = null) {
        const modal = document.getElementById("activityModal");
        const form = document.getElementById("activityForm");
        const modalTitle = document.getElementById("modalTitle");
        
        form.reset();
        document.getElementById("activityId").value = "";

        if (data) {
            modalTitle.innerText = "Edit Activity";
            document.getElementById("activityId").value = data.activityId;
            document.getElementById("activityDate").value = data.activityDate.split('T')[0];
            document.getElementById("description").value = data.description;
          
        } else {
            modalTitle.innerText = "Add New Activity";
            document.getElementById("activityDate").value = new Date().toISOString().split('T')[0];
        }

        modal.style.display = "flex";
    }

    function closeActivityModal() {
        document.getElementById("activityModal").style.display = "none";
    }

    // CREATE / UPDATE LOGIC
    document.getElementById("activityForm").onsubmit = async (e) => {
        e.preventDefault();
        
        const activityId = document.getElementById("activityId").value;
        const payload = {
            siteId: siteId,
            activityDate: document.getElementById("activityDate").value,
            description: document.getElementById("description").value,
     
        };

        const url = activityId ? `/md/activity/${activityId}` : `/md/activity`;
        const method = activityId ? "PUT" : "POST";

        try {
            const res = await fetch(url, {
                method: method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                closeActivityModal();
                loadActivities();
            } else {
                const err = await res.json();
                alert("Error: " + err.error);
            }
        } catch (err) {
            alert("Failed to save activity");
        }
    };

    async function deleteActivity(id) {
        if(!confirm("Are you sure you want to delete this log?")) return;
        try {
            await fetch(`/md/activity/${id}`, { method: 'DELETE' });
            loadActivities();
        } catch (err) {
            alert("Failed to delete activity");
        }
    }

    document.getElementById("statusFilter").onchange = filterData;

    // Load initial data
    loadActivities();

    // Close modal when clicking outside of it
    window.onclick = function(event) {
        const modal = document.getElementById("activityModal");
        if (event.target == modal) closeActivityModal();
    }
</script>
</body>
</html>
