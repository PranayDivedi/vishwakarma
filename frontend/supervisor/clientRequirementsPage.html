<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Client Requirements | Vishwakarma ERP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        :root {
            --primary-color: #0d9488;
            --primary-dark: #0f766e;
            --primary-light: #f0fdfa;
            --sidebar-bg: #1e293b;
            --sidebar-text: #cbd5e1;
            --sidebar-hover: #ffffff;
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --radius: 1rem;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Base Styles */
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-page); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Mobile Sidebar Overlay */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            z-index: 998;
        }

        /* Sidebar Styling */
        .sidebar { 
            width: 280px; 
            background: var(--sidebar-bg); 
            color: var(--sidebar-text); 
            display: flex; 
            flex-direction: column; 
            flex-shrink: 0; 
            transition: var(--transition);
            z-index: 1000;
        }

        .sidebar-header { 
            padding: 2rem 1.5rem; 
            text-align: center; 
            font-weight: 800; 
            font-size: 1.5rem; 
            color: white; 
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }

        .sidebar-nav { padding: 1rem; flex-grow: 1; overflow-y: auto; }
        .sidebar-nav a { 
            display: flex; align-items: center; gap: 12px; color: var(--sidebar-text); 
            text-decoration: none; padding: 12px 16px; border-radius: 12px; margin-bottom: 6px; 
            transition: var(--transition);
        }
        .sidebar-nav a:hover, .sidebar-nav a.active { 
            background: var(--primary-color); 
            color: white; 
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
        }
        .sidebar-nav i { width: 22px; font-size: 1.1rem; }

        /* Main Content Area */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; width: 100%; }
        
        .header { 
            background: white; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; 
            min-height: 70px;
        }

        .header-left { display: flex; align-items: center; gap: 1rem; }
        
        .menu-btn {
            display: none;
            background: var(--primary-light);
            border: none;
            color: var(--primary-color);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .header h2 { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
        .content-area { padding: 1.5rem; overflow-y: auto; flex-grow: 1; }

        /* Filter Section */
        .card { 
            background: white; 
            border-radius: var(--radius); 
            padding: 1.5rem; 
            box-shadow: var(--shadow); 
            border: 1px solid var(--border);
            margin-bottom: 2rem;
        }
        
        .filter-container { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .form-control { 
            padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; 
            outline: none; font-size: 0.9rem; transition: var(--transition); background: #fcfcfd;
        }
        .form-control:focus { 
            border-color: var(--primary-color); 
            background: white;
            box-shadow: 0 0 0 4px var(--primary-light); 
        }
        select.form-control { cursor: pointer; min-width: 220px; }

        /* Table Styling */
        .table-responsive { 
            overflow-x: auto; 
            margin: 0 -1.5rem; 
            padding: 0 1.5rem; 
        }

        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        
        thead th { 
            background: #f8fafc; text-align: left; padding: 14px 16px; color: var(--text-sub); 
            font-size: 0.75rem; text-transform: uppercase; font-weight: 700; border-bottom: 2px solid var(--border);
            letter-spacing: 0.05em;
        }

        tbody tr { border-bottom: 1px solid var(--border); transition: var(--transition); }
        tbody tr:hover { background: var(--primary-light); }
        td { padding: 16px; font-size: 0.9rem; vertical-align: middle; }

        /* Badges */
        .badge { 
            padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; 
            color: white; text-transform: capitalize; display: inline-flex; align-items: center; gap: 6px; 
        }
        .badge::before { content: ''; width: 6px; height: 6px; background: white; border-radius: 50%; }
        .done { background: var(--success); }
        .pending { background: var(--warning); }

        /* Buttons */
        .btn { 
            padding: 10px 20px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; 
            transition: var(--transition); display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem;
        }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(13, 148, 136, 0.2); }
        
        .btn-action { width: 34px; height: 34px; border-radius: 8px; justify-content: center; padding: 0; }
        .btn-edit { background: var(--primary-light); color: var(--primary-color); }
        .btn-edit:hover { background: var(--primary-color); color: white; }
        .btn-toggle { background: #eff6ff; color: var(--info); }
        .btn-toggle:hover { background: var(--info); color: white; }
        .btn-delete { background: #fef2f2; color: var(--danger); }
        .btn-delete:hover { background: var(--danger); color: white; }

        /* Modal */
        .modal { 
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); 
            display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(4px);
            padding: 1rem;
        }
        .modal-content { 
            background: white; padding: 2rem; width: 100%; max-width: 480px; border-radius: var(--radius); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-header { margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .modal-header h3 { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
        .modal-header i { color: var(--primary-color); }

        label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: var(--text-sub); margin-top: 15px; }
        textarea.form-control { width: 100%; resize: none; font-family: inherit; }

        /* Responsive Breakpoints */
        @media (max-width: 992px) {
            .sidebar {
                position: fixed;
                left: -280px;
                height: 100vh;
            }
            .sidebar.active { left: 0; }
            .sidebar-overlay.active { display: block; }
            .menu-btn { display: block; }
            .header h2 { font-size: 1.1rem; }
        }

        @media (max-width: 640px) {
            .content-area { padding: 1rem; }
            .card { padding: 1.25rem; }
            .btn span { display: none; }
            .btn i { margin: 0; }
            .filter-container select { width: 100%; }
        }
    </style>
</head>

<body>
    <!-- Mobile Sidebar Overlay -->
    <div class="sidebar-overlay" id="overlay"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">VISHWAKARMA</div>
        <nav class="sidebar-nav">
            <a href="/supervisor/dashboard"><i class="fas fa-tachometer-alt"></i> My Dashboard</a>
            <a href="/supervisor/allSitesPage"><i class="fas fa-building"></i> All Sites</a>
            <a href="/supervisor/employeesPage"><i class="fas fa-users"></i> Workforce</a>
            <a href="/supervisor/clientRequirementsPage" class="active"><i class="fas fa-clipboard-check"></i> Client Requirements</a>
            <a href="/supervisor/performancePage"><i class="fas fa-chart-bar"></i> Performance</a>
            <a href="/supervisor/allGalleryPage"><i class="fas fa-images"></i> Gallery</a>
            <a href="/supervisor/stockRequestsPage"><i class="fas fa-boxes"></i> Stock Requests</a>
            <a href="/supervisor/siteDetailsPage"><i class="fas fa-map-marked-alt"></i> Site Details</a>
            <a href="#" onclick="logout()" style="margin-top:auto; color: #fca5a5;"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <header class="header">
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h2>Client Requirements</h2>
            </div>
            <button class="btn btn-primary" onclick="openModal()">
                <i class="fas fa-plus"></i> <span>Add Requirement</span>
            </button>
        </header>

        <div class="content-area">
            <div class="card">
                <div class="filter-container">
                    <label style="margin-top: 0; font-size: 0.9rem; font-weight: 500;">Project View:</label>
                    <select id="siteFilter" class="form-control"></select>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Site / Project</th>
                                <th>Requirement Details</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="reqTable">
                            <!-- JS Dynamic Content -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="reqModal">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fas fa-clipboard-list fa-lg"></i>
                <h3 id="modalTitle">Add Requirement</h3>
            </div>
            <form id="reqForm">
                <input type="hidden" id="reqId">

                <label>Select Project</label>
                <select id="reqSite" class="form-control" style="width: 100%;" required></select>

                <label>Requirement Details</label>
                <textarea id="reqDetails" rows="5" class="form-control" placeholder="Describe the client requirement in detail..." required></textarea>

                <div style="margin-top: 30px; display: flex; gap: 12px; justify-content: flex-end;">
                    <button type="button" class="btn" style="background: #f1f5f9; color: #475569;" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API = {
            requirements: "/supervisor/client-requirements",
            sites: "/supervisor/supervisorSites",
            logout: "/auth/logout"
        };

        let editing = false;

        /* MOBILE MENU TOGGLE */
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        document.getElementById('overlay').onclick = toggleSidebar;

        /* LOAD SITES */
        async function loadSites() {
            try {
                const sites = await fetch(API.sites).then(r => r.json());
                const siteFilter = document.getElementById("siteFilter");
                const reqSite = document.getElementById("reqSite");

                siteFilter.innerHTML = `<option value="">All Active Projects</option>`;
                reqSite.innerHTML = "";

                sites.forEach(s => {
                    const opt = `<option value="${s.siteId}">${s.siteName}</option>`;
                    siteFilter.innerHTML += opt;
                    reqSite.innerHTML += opt;
                });
            } catch (e) { console.error("Error loading sites", e); }
        }

        /* LOAD REQUIREMENTS */
        async function loadRequirements(siteId = "") {
            try {
                const url = siteId ? `${API.requirements}?siteId=${siteId}` : API.requirements;
                const data = await fetch(url).then(r => r.json());
                const tbody = document.getElementById("reqTable");

                tbody.innerHTML = data.length ? "" :
                    `<tr><td colspan="5" style="text-align:center; padding: 3rem; color: var(--text-sub);">No requirements found for this project.</td></tr>`;

                data.forEach(r => {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong style="color: var(--text-main); font-weight: 700;">${r.siteName}</strong></td>
                            <td style="max-width: 350px; line-height: 1.5; color: var(--text-sub);">${r.details}</td>
                            <td>
                                <span class="badge ${r.completed ? "done" : "pending"}">
                                    ${r.completed ? "Completed" : "Pending"}
                                </span>
                            </td>
                            <td style="color: var(--text-sub); font-size: 0.8rem; font-weight: 500;">
                                <i class="far fa-calendar-alt" style="margin-right: 4px;"></i>
                                ${new Date(r.createdAt).toLocaleDateString("en-IN", {day: '2-digit', month: 'short'})}
                            </td>
                            <td style="text-align: right;">
                                <div style="display: inline-flex; gap: 8px;">
                                    <button class="btn btn-action btn-edit" onclick='editReq(${JSON.stringify(r)})' title="Edit">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-action btn-toggle" 
                                        onclick='toggleStatus(${r.requirementId}, ${r.completed})' title="Toggle Status">
                                        <i class="fas fa-check"></i>
                                    </button>
                                    <button class="btn btn-action btn-delete" 
                                        onclick='deleteReq(${r.requirementId})' title="Delete">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) { console.error("Error loading requirements", e); }
        }

        /* FILTER */
        document.getElementById("siteFilter").onchange = (e) => loadRequirements(e.target.value);

        /* MODAL CONTROLS */
        function openModal() {
            editing = false;
            document.getElementById("reqForm").reset();
            document.getElementById("modalTitle").innerText = "Add Requirement";
            document.getElementById("reqModal").style.display = "flex";
        }
        function closeModal() { document.getElementById("reqModal").style.display = "none"; }

        /* EDIT */
        function editReq(r) {
            editing = true;
            document.getElementById("modalTitle").innerText = "Edit Requirement";
            document.getElementById("reqId").value = r.requirementId;
            document.getElementById("reqSite").value = r.siteId;
            document.getElementById("reqDetails").value = r.details;
            document.getElementById("reqModal").style.display = "flex";
        }

        /* SAVE */
        document.getElementById("reqForm").onsubmit = async e => {
            e.preventDefault();
            const payload = {
                siteId: document.getElementById("reqSite").value,
                details: document.getElementById("reqDetails").value
            };

            const method = editing ? "PUT" : "POST";
            const url = editing
                ? `${API.requirements}/${document.getElementById("reqId").value}`
                : API.requirements;

            try {
                await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                closeModal();
                loadRequirements(document.getElementById("siteFilter").value);
            } catch (err) {
                alert("Failed to save data. Please try again.");
            }
        };

        /* TOGGLE STATUS */
        async function toggleStatus(id, current) {
            try {
                await fetch(`${API.requirements}/${id}/status`, {
                    method: "PATCH",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ completed: !current })
                });
                loadRequirements(document.getElementById("siteFilter").value);
            } catch (err) { console.error(err); }
        }

        /* DELETE */
        function deleteReq(id) {
            if (!confirm("Are you sure you want to delete this requirement?")) return;
            fetch(`${API.requirements}/${id}`, { method: "DELETE" })
                .then(() => loadRequirements(document.getElementById("siteFilter").value));
        }

        /* LOGOUT */
        function logout() {
            if(confirm("Are you sure you want to logout?")) {
                fetch(API.logout, { method: "POST" }).then(() => location.href = "/");
            }
        }

        /* INITIALIZE */
        loadSites();
        loadRequirements();
    </script>
</body>
</html>
