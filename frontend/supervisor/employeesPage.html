<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Workforce Management | Vishwakarma ERP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        :root {
            --primary-color: #0d9488; 
            --primary-color-dark: #0f766e; 
            --primary-color-light: #f0fdfa;
            --sidebar-bg: #1e293b; 
            --sidebar-text: #cbd5e1; 
            --sidebar-text-hover: #ffffff;
            --background-page: #f8fafc; 
            --background-card: #ffffff;
            --text-primary: #0f172a; 
            --text-secondary: #64748b; 
            --text-muted: #94a3b8;
            --border-color: #e2e8f0; 
            --success-color: #10b981; 
            --danger-color: #ef4444;
            --warning-color: #f59e0b; 
            --info-color: #3b82f6;
            --font-family: 'Poppins', sans-serif; 
            --border-radius: 1rem;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Base Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-family); }
        body { background-color: var(--background-page); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Navigation */
        .sidebar { 
            width: 280px; 
            background-color: var(--sidebar-bg); 
            color: var(--sidebar-text); 
            display: flex; 
            flex-direction: column; 
            transition: var(--transition);
            z-index: 1000;
            position: relative;
        }

        .sidebar-header { 
            padding: 2rem 1.5rem; 
            text-align: center; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }

        .logo-text { 
            font-size: 1.5rem; 
            font-weight: 800; 
            color: white; 
            text-decoration: none; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sidebar-nav { flex-grow: 1; padding: 1rem; overflow-y: auto; }
        
        .sidebar-nav a { 
            display: flex; 
            align-items: center; 
            color: var(--sidebar-text); 
            text-decoration: none; 
            padding: 12px 16px; 
            border-radius: 12px; 
            margin-bottom: 6px; 
            transition: var(--transition);
        }

        .sidebar-nav a:hover, .sidebar-nav a.active { 
            background-color: var(--primary-color); 
            color: white; 
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
        }

        .sidebar-nav i { margin-right: 12px; width: 20px; text-align: center; font-size: 1.1rem; }

        /* Main Content Area */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; width: 100%; }
        
        .header { 
            background: var(--background-card); 
            padding: 1rem 1.5rem; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            min-height: 70px;
        }

        .header-left { display: flex; align-items: center; gap: 1rem; }
        
        .menu-toggle {
            display: none;
            background: var(--primary-color-light);
            border: none;
            color: var(--primary-color);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .header h2 { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); }

        .content-area { padding: 1.5rem; overflow-y: auto; flex-grow: 1; }

        /* Card & Table Styling */
        .card { 
            background: var(--background-card); 
            border-radius: var(--border-radius); 
            padding: 1.5rem; 
            box-shadow: var(--shadow-md); 
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .table-container { overflow-x: auto; margin: 0 -1.5rem; padding: 0 1.5rem; }

        table { width: 100%; border-collapse: collapse; min-width: 850px; }
        
        thead th { 
            background-color: #f8fafc; 
            padding: 14px 16px; 
            text-align: left; 
            font-size: 0.75rem; 
            font-weight: 600; 
            color: var(--text-secondary); 
            border-bottom: 2px solid var(--border-color); 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
        }

        tbody tr { border-bottom: 1px solid var(--border-color); transition: var(--transition); }
        tbody tr:hover { background-color: var(--primary-color-light); }
        
        td { padding: 16px; font-size: 0.9rem; color: var(--text-primary); vertical-align: middle; }

        /* Status Badges */
        .status { 
            padding: 4px 10px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: 700; 
            text-transform: capitalize; 
            color: white; 
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .status::before { content: ''; width: 6px; height: 6px; background: white; border-radius: 50%; }
        .status.active { background: var(--success-color); }
        .status.standBy { background: var(--info-color); }
        .status.onLeave { background: var(--warning-color); }

        /* Buttons */
        .btn { 
            padding: 10px 20px; 
            border-radius: 10px; 
            border: none; 
            font-weight: 600; 
            cursor: pointer; 
            transition: var(--transition); 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            text-decoration: none; 
            font-size: 0.85rem; 
        }

        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: var(--primary-color-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(13, 148, 136, 0.2); }
        
        .btn-action { width: 32px; height: 32px; padding: 0; justify-content: center; border-radius: 8px; }
        .btn-danger { background: #fee2e2; color: var(--danger-color); }
        .btn-danger:hover { background: var(--danger-color); color: white; }
        
        .btn-edit { background: var(--primary-color-light); color: var(--primary-color); }
        .btn-edit:hover { background: var(--primary-color); color: white; }

        /* Modal Styling */
        .modal { 
            position: fixed; 
            inset: 0; 
            background: rgba(15, 23, 42, 0.6); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 2000; 
            backdrop-filter: blur(4px);
            padding: 1rem;
        }

        .modal-content { 
            background: white; 
            padding: 2rem; 
            width: 100%;
            max-width: 480px; 
            border-radius: var(--border-radius); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); 
            animation: slideUp 0.3s ease-out; 
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .modal-header { margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .modal-header h3 { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); }
        .modal-header i { color: var(--primary-color); }
        
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-top: 15px; }
        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            outline: none; 
            font-size: 0.95rem; 
            transition: var(--transition); 
            background: #fcfcfd;
        }
        input:focus, select:focus { border-color: var(--primary-color); background: white; box-shadow: 0 0 0 4px var(--primary-color-light); }

        /* Overlay for mobile sidebar */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        /* Responsive Breakpoints */
        @media (max-width: 992px) {
            .sidebar {
                position: fixed;
                left: -280px;
                height: 100vh;
            }
            .sidebar.active { left: 0; }
            .sidebar-overlay.active { display: block; }
            .menu-toggle { display: block; }
            .header h2 { font-size: 1.1rem; }
            .btn span { display: none; } /* Hide text in "Add Employee" button on small mobiles */
            .btn i { margin-right: 0; }
        }

        @media (max-width: 640px) {
            .content-area { padding: 1rem; }
            .card { padding: 1rem; }
            .modal-content { padding: 1.5rem; }
        }
    </style>
</head>

<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="#" class="logo-text">Vishwakarma</a>
        </div>
        <nav class="sidebar-nav">
            <a href="/supervisor/dashboard"><i class="fas fa-tachometer-alt"></i> My Dashboard</a>
            <a href="/supervisor/allSitesPage"><i class="fas fa-building"></i> All Sites</a>
            <a href="/supervisor/employeesPage" class="active"><i class="fas fa-users"></i> Workforce</a>
            <a href="/supervisor/clientRequirementsPage"><i class="fas fa-clipboard-check"></i> Client Requirements</a>
            <a href="/supervisor/performancePage"><i class="fas fa-chart-bar"></i> Performance</a>
            <a href="/supervisor/allGalleryPage"><i class="fas fa-images"></i> Gallery</a>
            <a href="/supervisor/stockRequestsPage"><i class="fas fa-boxes"></i> Stock Requests</a>
            <a href="/supervisor/siteDetailsPage"><i class="fas fa-map-marked-alt"></i> Site Details</a>
            <a href="#" onclick="logout()" style="margin-top:auto; color: #fca5a5;"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h2>Workforce Management</h2>
            </div>
            <button class="btn btn-primary" onclick="openEmployee()">
                <i class="fas fa-plus"></i> <span>Add Employee</span>
            </button>
        </header>

        <div class="content-area">
            <div class="card">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Role</th>
                                <th>Contact</th>
                                <th>Status</th>
                                <th>Assigned Site</th>
                                <th style="text-align: right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTable">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- EMPLOYEE MODAL -->
    <div class="modal" id="employeeModal">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fas fa-user-edit fa-lg"></i>
                <h3 id="empTitle">Add Employee</h3>
            </div>
            <form id="employeeForm">
                <input type="hidden" id="employeeId">

                <label>Full Name</label>
                <input id="employeeName" placeholder="Enter full name" required>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>Role</label>
                        <input id="empRole" placeholder="e.g. Mason" required>
                    </div>
                    <div>
                        <label>Phone Number</label>
                        <input id="empPhone" type="tel" placeholder="10-digit number">
                    </div>
                </div>

                <label>Current Status</label>
                <select id="empStatus">
                    <option value="active">Active</option>
                    <option value="standBy">Stand By</option>
                    <option value="onLeave">On Leave</option>
                </select>

                <label>Assigned Site</label>
                <select id="empSite"><option value="">Unassigned</option></select>

                <div style="margin-top:30px; display:flex; gap:12px; justify-content: flex-end;">
                    <button type="button" class="btn" style="background: #f1f5f9; color: #475569;" onclick="closeEmployee()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Employee</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API = {
            employees: "/md/employees",
            sites: "/supervisor/supervisorSites"
        };

        let editEmp = false;

        /* MOBILE SIDEBAR TOGGLE */
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        document.getElementById('sidebarOverlay').onclick = toggleSidebar;

        /* AUTO ID GENERATOR */
        function genId(prefix) {
            return prefix + "-" + Math.floor(1000 + Math.random() * 9000);
        }

        /* LOAD EMPLOYEES */
        async function loadEmployees() {
            try {
                const res = await fetch(API.employees);
                const d = await res.json();
                const tableBody = document.getElementById("employeeTable");
                
                tableBody.innerHTML = d.map(e => `
                    <tr>
                        <td style="font-family: monospace; font-weight: 600; color: var(--text-muted);">${e.employeeId}</td>
                        <td>
                            <div style="font-weight: 700; color: var(--text-primary);">${e.employeeName}</div>
                        </td>
                        <td><span style="background:#f1f5f9; padding:2px 8px; border-radius:6px; font-size:0.8rem;">${e.role}</span></td>
                        <td><i class="fas fa-phone-alt" style="font-size:0.75rem; color:var(--text-muted); margin-right:5px;"></i>${e.phoneNumber || "-"}</td>
                        <td><span class="status ${e.status}">${e.status}</span></td>
                        <td>
                            <div style="display:flex; align-items:center; gap:6px; color: ${e.siteName ? 'var(--primary-color)' : 'var(--text-muted)'}; font-weight: 500;">
                                <i class="fas fa-map-marker-alt" style="font-size: 0.8rem;"></i>
                                ${e.siteName || "Unassigned"}
                            </div>
                        </td>
                        <td style="text-align: right;">
                            <div style="display:flex; justify-content:flex-end; gap:8px;">
                                <button class="btn btn-action btn-edit" title="Edit" onclick='editEmployee(${JSON.stringify(e)})'><i class="fas fa-pen"></i></button>
                                <button class="btn btn-action btn-danger" title="Delete" onclick='deleteEmployee("${e.employeeId}")'><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </td>
                    </tr>`).join("");
            } catch (err) {
                console.error("Error loading employees:", err);
            }
        }

        /* LOAD SITES */
        async function loadSites() {
            try {
                const res = await fetch(API.sites);
                const d = await res.json();
                const empSite = document.getElementById("empSite");
                empSite.innerHTML = '<option value="">Unassigned</option>';
                d.forEach(s => {
                    empSite.innerHTML += `<option value="${s.siteId}">${s.siteName}</option>`;
                });
            } catch (err) {
                console.error("Error loading sites:", err);
            }
        }

        /* MODAL CONTROLS */
        function openEmployee() {
            editEmp = false;
            document.getElementById("empTitle").innerText = "Add New Employee";
            document.getElementById("employeeForm").reset();
            document.getElementById("employeeId").value = genId("EMP");
            document.getElementById("employeeModal").style.display = "flex";
        }

        function editEmployee(e) {
            editEmp = true;
            document.getElementById("empTitle").innerText = "Edit Employee";
            document.getElementById("employeeId").value = e.employeeId;
            document.getElementById("employeeName").value = e.employeeName;
            document.getElementById("empRole").value = e.role;
            document.getElementById("empPhone").value = e.phoneNumber || "";
            document.getElementById("empStatus").value = e.status;
            document.getElementById("empSite").value = e.assignedSiteId || "";
            document.getElementById("employeeModal").style.display = "flex";
        }

        function closeEmployee() {
            document.getElementById("employeeModal").style.display = "none";
        }

        /* FORM SUBMISSION */
        document.getElementById("employeeForm").onsubmit = async e => {
            e.preventDefault();
            const payload = {
                employeeId: document.getElementById("employeeId").value,
                employeeName: document.getElementById("employeeName").value,
                role: document.getElementById("empRole").value,
                phoneNumber: document.getElementById("empPhone").value,
                status: document.getElementById("empStatus").value,
                assignedSiteId: document.getElementById("empSite").value || null
            };
            
            try {
                const url = editEmp ? `${API.employees}/${payload.employeeId}` : API.employees;
                await fetch(url, {
                    method: editEmp ? "PUT" : "POST",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                closeEmployee();
                loadEmployees();
            } catch (err) {
                alert("Failed to save employee data.");
            }
        };

        function deleteEmployee(id) {
            if (confirm("Permanently remove this employee from the records?")) {
                fetch(`${API.employees}/${id}`, { method: "DELETE" }).then(() => loadEmployees());
            }
        }

        function logout() {
            if(confirm("Are you sure you want to logout?")) {
                fetch("/auth/logout", { method: "POST" }).then(() => location.href = "/");
            }
        }

        /* INITIALIZE */
        loadEmployees();
        loadSites();
    </script>

</body>
</html>
