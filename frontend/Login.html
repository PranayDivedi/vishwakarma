<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Vishwakarma - Login</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #0d9488;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            background: var(--bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: var(--card);
            width: 420px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,.1);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
            font-size: 1.5rem;
        }

        /* TABS STYLING */
        .tabs {
            display: flex;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            transition: 0.3s;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
            position: relative;
        }

        label {
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        /* NEW PASSWORD EYE STYLING */
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.9rem;
            z-index: 5;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn.secondary {
            background: #334155;
            margin-bottom: 12px;
        }

        #companySuggestions {
            display: none;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            max-height: 150px;
            overflow-y: auto;
            position: absolute;
            width: 100%;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #companySuggestions div {
            padding: 8px;
            cursor: pointer;
        }

        #companySuggestions div:hover {
            background: #f1f5f9;
        }

        .forget-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            text-decoration: none;
            color: var(--primary);
            font-size: 0.85rem;
        }

        /* MODAL STYLING */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 14px;
        }

        #cancel-btn {
            background: #ef4444;
            display: block;
            text-align: center;
            text-decoration: none;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="login-card">
    <h1>Vishwakarma ERP</h1>

    <!-- Tab Navigation -->
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'standardLogin')">User Login</button>
        <button class="tab-btn" onclick="openTab(event, 'clientLogin')">Client Login</button>
    </div>

    <!-- Tab 1: Standard Login -->
    <div id="standardLogin" class="tab-content active">
        <form id="loginForm">
            <div class="form-group">
                <label>Company</label>
                <input type="text" id="companySearch" placeholder="Search company name" autocomplete="off">
                <input type="hidden" id="companyId">
                <input type="hidden" id="companyEmail">
                <div id="companySuggestions"></div>
            </div>

            <button type="button" class="btn secondary" id="openMdSignupBtn" style="display:none;">
                Sign up as MD
            </button>

            <div class="form-group">
                <label>User Id</label>
                <input type="text" id="userId" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="password-container">
                    <input type="password" id="loginPassword" required>
                    <i class="fas fa-eye toggle-password"></i>
                </div>
            </div>

            <button class="btn">Login</button>
            <a href="/resetPassword/forgetPasswordPage" class="forget-link">Forget Password?</a>
        </form>
    </div>

    <!-- Tab 2: Client Login -->
    <div id="clientLogin" class="tab-content">
        <form id="clientLoginForm">
            <div class="form-group">
                <label>Site ID</label>
                <input type="text" id="siteId" placeholder="Enter Site ID" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="sitePhone" placeholder="Enter Registered Phone" required>
            </div>

            <button class="btn">Client Login</button>
          
        </form>
    </div>
</div>

<!-- MD SIGNUP MODAL -->
<div class="modal" id="mdSignupModal">
    <div class="modal-content">
        <h2 style="text-align:center; color: var(--primary)">Register Company MD</h2>
        <div class="form-group">
            <label>MD Name</label>
            <input type="text" id="mdName">
        </div>
        <div class="form-group">
            <label>Password</label>
            <div class="password-container">
                <input type="password" id="mdPassword">
                <i class="fas fa-eye toggle-password"></i>
            </div>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="mdUserEmail">
        </div>
        <p style="font-size:0.8rem;color:#475569">OTP will be sent to the company registered email.</p>
        <button class="btn" id="sendOtpBtn">Send OTP</button>
        <div class="form-group" id="otpGroup" style="display:none;margin-top:15px;">
            <label>Enter OTP</label>
            <input type="text" id="mdOtp">
        </div>
        <button class="btn" id="verifyOtpBtn" style="display:none;margin-top:10px;">Verify & Create MD</button>
        <a href="javascript:void(0)" onclick="document.getElementById('mdSignupModal').style.display='none'" id="cancel-btn">Cancel</a>
    </div>
</div>

<script>
/* PASSWORD TOGGLE LOGIC */
document.querySelectorAll('.toggle-password').forEach(icon => {
    icon.addEventListener('click', function() {
        const input = this.previousElementSibling;
        if (input.type === "password") {
            input.type = "text";
            this.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = "password";
            this.classList.replace('fa-eye-slash', 'fa-eye');
        }
    });
});

/* TAB SWITCHING LOGIC */
function openTab(evt, tabName) {
    const contents = document.getElementsByClassName("tab-content");
    for (let i = 0; i < contents.length; i++) {
        contents[i].classList.remove("active");
    }
    const btns = document.getElementsByClassName("tab-btn");
    for (let i = 0; i < btns.length; i++) {
        btns[i].classList.remove("active");
    }
    document.getElementById(tabName).classList.add("active");
    evt.currentTarget.classList.add("active");
}

/* ELEMENTS */
const companySearch = document.getElementById("companySearch");
const companyIdInput = document.getElementById("companyId");
const companyEmailInput = document.getElementById("companyEmail");
const suggestionsBox = document.getElementById("companySuggestions");
const openMdSignupBtn = document.getElementById("openMdSignupBtn");
const mdModal = document.getElementById("mdSignupModal");

const sendOtpBtn = document.getElementById("sendOtpBtn");
const verifyOtpBtn = document.getElementById("verifyOtpBtn");
const otpGroup = document.getElementById("otpGroup");

const mdName = document.getElementById("mdName");
const mdPassword = document.getElementById("mdPassword");
const mdUserEmail = document.getElementById("mdUserEmail");
const mdOtp = document.getElementById("mdOtp");

/* COMPANY SEARCH (Tab 1) */
companySearch.addEventListener("input", async () => {
    const q = companySearch.value.trim();
    openMdSignupBtn.style.display = "none";
    companyIdInput.value = "";
    companyEmailInput.value = "";

    if (!q) {
        suggestionsBox.style.display = "none";
        return;
    }

    try {
        const res = await fetch(`/auth/companies/search?q=${encodeURIComponent(q)}`);
        const companies = await res.json();

        suggestionsBox.innerHTML = "";
        companies.forEach(c => {
            const div = document.createElement("div");
            div.textContent = `${c.companyName} (${c.companyId})`;
            div.onclick = async () => {
                companySearch.value = c.companyName;
                companyIdInput.value = c.companyId;
                suggestionsBox.style.display = "none";

                const info = await fetch(`/admin/CompanyDataForAdmin?companyId=${c.companyId}`);
                const data = await info.json();
                companyEmailInput.value = data.contactEmail;

                const check = await fetch(`/auth/company/has-md/${c.companyId}`);
                const md = await check.json();
                if (!md.hasMD) openMdSignupBtn.style.display = "block";
            };
            suggestionsBox.appendChild(div);
        });
        suggestionsBox.style.display = "block";
    } catch (e) { console.error("Search error", e); }
});

/* MODAL TOGGLE */
openMdSignupBtn.onclick = () => mdModal.style.display = "flex";

/* SEND OTP */
sendOtpBtn.onclick = async () => {
    if (!companyEmailInput.value) { alert("Company email not found"); return; }
    await fetch("/auth/md/send-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: companyEmailInput.value })
    });
    alert("OTP sent to company email");
    otpGroup.style.display = "block";
    verifyOtpBtn.style.display = "block";
};

/* VERIFY OTP */
verifyOtpBtn.onclick = async () => {
    const payload = {
        name: mdName.value.trim(),
        password: mdPassword.value.trim(),
        userEmail: mdUserEmail.value.trim(),
        otp: mdOtp.value.trim(),
        companyId: companyIdInput.value,
        email: companyEmailInput.value
    };
    if (!payload.name || !payload.password || !payload.otp) { alert("All fields required"); return; }

    const res = await fetch("/auth/md/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (res.ok) {
        alert("MD registered successfully. Please login.");
        mdModal.style.display = "none";
        openMdSignupBtn.style.display = "none";
    } else {
        alert(data.error || "Signup failed");
    }
};

/* LOGIN FORM 1 (Standard) */
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
        userId: document.getElementById("userId").value.trim(),
        password: document.getElementById("loginPassword").value.trim(),
        companyId: companyIdInput.value
    };
    const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (res.ok) window.location.href = data.redirectUrl;
    else alert(data.error || "Login failed");
});

/* LOGIN FORM 2 (Client Login) */
document.getElementById("clientLoginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
        siteId: document.getElementById("siteId").value.trim(),
        phoneNumber: document.getElementById("sitePhone").value.trim()
    };
    
    // Call your specific site login endpoint here
    const res = await fetch("/auth/clientLogin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });

    const data = await res.json();
    if (res.ok) window.location.href = data.redirectUrl;
    else alert(data.error || "Site login failed");
});

// Close suggestions when clicking outside
document.addEventListener("click", (e) => {
    if (e.target !== companySearch) suggestionsBox.style.display = "none";
});
</script>

</body>
</html>
