<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIPS HR - Change Password</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
--primary:#2196f3;--primary-dark:#1976d2;--bg:#f4f6f9;--border:#dee2e6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto;background:var(--bg);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.box{background:#fff;padding:40px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.08);width:100%;max-width:450px}
.logo{text-align:center;margin-bottom:25px}
.logo img{max-width:150px}
h2{text-align:center;margin-bottom:6px}
p{text-align:center;color:#6c757d;margin-bottom:20px}

.form-group{margin-bottom:16px;position:relative}
label{display:block;margin-bottom:6px;font-weight:500}
.input{width:100%;padding:12px 40px;border-radius:8px;border:1px solid var(--border)}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(33,150,243,.2)}
.icon{position:absolute;left:12px;top:38px;color:#aaa}

.btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--primary);color:white;font-weight:700;cursor:pointer}
.btn:hover{background:var(--primary-dark)}

.msg{display:none;padding:10px;border-radius:8px;margin-bottom:15px;font-weight:500}
.msg.success{background:#e8f5e9;color:#2e7d32}
.msg.error{background:#fdecea;color:#c62828}
.msg.info{background:#fff3e0;color:#ef6c00}

/* company suggestion */
.suggestions{
position:absolute;top:70px;left:0;right:0;
background:#fff;border:1px solid var(--border);
border-radius:8px;max-height:180px;overflow:auto;z-index:10;display:none
}
.suggestions div{
padding:10px;cursor:pointer
}
.suggestions div:hover{background:#f1f5f9}

.toggle-password{
position:absolute;right:12px;top:38px;cursor:pointer;color:#aaa
}
</style>
</head>

<body>

<div class="box">

<div class="logo"><img src="images/sips_logo.png"></div>
<h2>Reset Password</h2>
<p id="subtitle">Enter company and user ID</p>

<div id="msg" class="msg"></div>

<form id="form">

<!-- STEP 1 -->
<div id="step1">

<div class="form-group">
<label>Company</label>
<i class="fas fa-building icon"></i>
<input id="companyInput" class="input" placeholder="Type company name">
<div id="companyList" class="suggestions"></div>
</div>

<div class="form-group">
<label>User ID</label>
<i class="fas fa-id-card icon"></i>
<input id="userIdInput" class="input" placeholder="EMP-001">
</div>

<button type="button" id="sendOtpBtn" class="btn">Send OTP</button>
<a href="/">Cancel</a>
</div>

<!-- STEP 2 -->
<div id="step2" style="display:none">

<div class="form-group">
<label>Enter OTP</label>
<i class="fas fa-key icon"></i>
<input id="otpInput" class="input" placeholder="6 digit OTP">
</div>

<button type="button" id="verifyOtpBtn" class="btn">Verify OTP</button>
<a href="/">Cancel</a>
</div>

<!-- STEP 3 -->
<div id="step3" style="display:none">

<div class="form-group">
<label>New Password</label>
<i class="fas fa-lock icon"></i>
<input id="newPass" type="password" class="input">
<i class="fas fa-eye-slash toggle-password"></i>
</div>

<div class="form-group">
<label>Confirm Password</label>
<i class="fas fa-lock icon"></i>
<input id="confirmPass" type="password" class="input">
<i class="fas fa-eye-slash toggle-password"></i>
</div>

<button class="btn">Change Password</button>
<a href="/">Cancel</a>
</div>

</form>
</div>

<script>
let selectedCompanyId=null;

const msg=e=>{m.textContent=e;};
const m=document.getElementById("msg");

function show(t,type){m.className="msg "+type;m.textContent=t;m.style.display="block";}
function hide(){m.style.display="none";}

/* COMPANY AUTOCOMPLETE */
const companyInput=document.getElementById("companyInput");
const companyList=document.getElementById("companyList");

companyInput.addEventListener("input", async ()=>{
  const q=companyInput.value.trim();
  selectedCompanyId=null;
  if(!q){companyList.style.display="none";return;}

  const res=await fetch(`/auth/companies/search?q=${encodeURIComponent(q)}`);
  const data=await res.json();

  companyList.innerHTML="";
  if(!data.length){companyList.style.display="none";return;}

  data.forEach(c=>{
    const d=document.createElement("div");
    d.textContent=c.companyName;
    d.onclick=()=>{
      companyInput.value=c.companyName;
      selectedCompanyId=c.companyId;
      companyList.style.display="none";
    };
    companyList.appendChild(d);
  });
  companyList.style.display="block";
});

/* SEND OTP */
sendOtpBtn.onclick=async()=>{
hide();
const userId=userIdInput.value.trim();

if(!selectedCompanyId||!userId) return show("Company and User ID required","error");

show("Sending OTP...","info");

const res=await fetch("/resetPassword/send-password-otp",{
method:"POST",headers:{'Content-Type':'application/json'},
body:JSON.stringify({userId,companyId:selectedCompanyId})
});
const d=await res.json();
if(!res.ok) return show(d.message,"error");

step1.style.display="none";step2.style.display="block";
show("OTP sent to registered email","success");
};

/* VERIFY OTP */
verifyOtpBtn.onclick=async()=>{
hide();
const otp=otpInput.value.trim();
const userId=userIdInput.value.trim();

if(!otp) return show("Enter OTP","error");

const res=await fetch("/resetPassword/verify-password-otp",{
method:"POST",headers:{'Content-Type':'application/json'},
body:JSON.stringify({userId,companyId:selectedCompanyId,OTP:otp})
});
const d=await res.json();
if(!res.ok) return show(d.message,"error");

step2.style.display="none";step3.style.display="block";
show("OTP verified","success");
};

/* RESET PASSWORD */
form.onsubmit=async e=>{
e.preventDefault();hide();
if(newPass.value.length<8) return show("Min 8 characters","error");
if(newPass.value!==confirmPass.value) return show("Passwords mismatch","error");

const res=await fetch("/resetPassword/reset-password",{
method:"POST",headers:{'Content-Type':'application/json'},
body:JSON.stringify({NewPassword:newPass.value})
});
const d=await res.json();
if(!res.ok) return show(d.message,"error");

show("Password updated. Redirecting...","success");
setTimeout(()=>location.href="/",2000);
};

/* TOGGLE PASSWORD */
document.querySelectorAll(".toggle-password").forEach(i=>{
i.onclick=()=>{
const inp=i.previousElementSibling;
inp.type=inp.type==="password"?"text":"password";
i.classList.toggle("fa-eye");i.classList.toggle("fa-eye-slash");
};
});
</script>

</body>
</html>
